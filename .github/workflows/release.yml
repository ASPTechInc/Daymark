# This workflow creates a Daymark release 
# when a tag matching 'v*' is pushed to the 'main' branch
# e.g. git tag v1.0.0
#      git push origin v1.0.0
name: Create Daymark release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Error: tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

      # Build/release steps go here
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version from build.gradle
        id: get_version
        run: |
          VERSION=$(grep "versionName =" app/build.gradle | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "$VERSION" > version.txt
          echo "Extracted Version: $VERSION"

      - name: Create and populate signing.properties
        run: |
          echo "storeFile=${{ secrets.KEYSTORE_FILE_NAME }}" > app/signing.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> app/signing.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> app/signing.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> app/signing.properties

      - name: Decode and write keystore file
        run: |
          echo "${{ secrets.KEYSTORE_CONTENT }}" | base64 --decode > app/keystore.jks

      - name: Build Release APK and Bundle
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease
        env:
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}

      - name: Upload APK artefact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/daymark-foss-release.apk
          retention-days: 1

      - name: Upload Bundle artefact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/daymark-foss-release.aab
          retention-days: 1

      - name: Upload version artefact
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: version.txt

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download APK artefact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: ./

      - name: Download Bundle artefact
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundle
          path: ./

      - name: Download version artefact
        uses: actions/download-artifact@v4
        with:
          name: version-file
          path: ./

      - name: Get the version from version.txt
        id: get_version
        run: |
          VERSION=$(cat version.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if release exists
        id: check_release
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.VERSION;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `v${version}`
              });
              core.setOutput('releaseExists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('releaseExists', 'false');
              } else {
                throw error;
              }
            }

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        if: steps.check_release.outputs.releaseExists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          body: |
            Automatic release generated by GitHub Actions for Daymark v${{ env.VERSION }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        if: steps.check_release.outputs.releaseExists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./daymark-foss-release.apk
          asset_name: daymark-v${{ env.VERSION }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Bundle to Release
        uses: actions/upload-release-asset@v1
        if: steps.check_release.outputs.releaseExists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./daymark-foss-release.aab
          asset_name: daymark-v${{ env.VERSION }}.aab
          asset_content_type: application/octet-stream

      - name: Cleanup
        if: always()
        run: |
          rm -f version.txt
          rm -f daymark-foss-release.apk
          rm -f daymark-foss-release.aab
